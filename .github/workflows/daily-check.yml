name: Check Antigravity and publish Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 00:00 Asia/Shanghai (16:00 UTC previous day).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: antigravity-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check official sources
        if: github.event_name != 'push'
        run: node scripts/check-status.mjs

      - name: Save verified status
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Antigravity status"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
