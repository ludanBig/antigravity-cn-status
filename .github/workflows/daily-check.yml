name: Check Antigravity and publish Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 00:00 Asia/Shanghai (16:00 UTC previous day).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: antigravity-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      status_sha256: ${{ steps.snapshot.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check official sources
        if: github.event_name != 'push'
        run: node scripts/check-status.mjs

      - name: Save verified status
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Antigravity status"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Record expected public status
        id: snapshot
        run: echo "sha256=$(sha256sum site/status.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
        run: |
          test -n "$EXPECTED_ARTIFACT"
          for attempt in {1..8}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" |
                jq -e --arg id "$EXPECTED_ARTIFACT" 'any(.artifacts[]; (.id | tostring) == $id and .name == "github-pages" and .expired == false)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected Pages artifact is not visible for this run"
          exit 1

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published status.json
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.status_sha256 }}
        run: |
          test -n "$PAGE_URL" && test -n "$EXPECTED_SHA256" || exit 1
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "${PAGE_URL%/}/status.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" -o "$RUNNER_TEMP/published-status.json" &&
                printf "%s  %s\n" "$EXPECTED_SHA256" "$RUNNER_TEMP/published-status.json" | sha256sum --check --status; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public status.json does not match the deployed status"
          exit 1
