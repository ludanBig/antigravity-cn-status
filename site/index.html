<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e19">
<meta name="description" content="一眼查看 Google Antigravity App 最新版本与官方中文界面支持状态">
<title>Antigravity 中文支持状态</title>
<style>
:root {
  color-scheme: dark;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #f0f4ff;
  background: #090e19;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background:
    radial-gradient(ellipse 66% 56% at 50% 13%, #18335b70, transparent 75%),
    radial-gradient(ellipse 45% 38% at 92% 90%, #14244355, transparent 80%),
    #090e19;
}
a { color: inherit; }
.page {
  width: min(100% - 48px, 1100px);
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
.topbar {
  display: flex;
  align-items: center;
  min-height: 86px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #ecf2ff;
  text-decoration: none;
  font-size: 17px;
  font-weight: 740;
  letter-spacing: -.025em;
}
.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid #5c7bc080;
  border-radius: 10px;
  background: linear-gradient(145deg, #294a86, #15223b);
  color: #c4d6ff;
  box-shadow: 0 5px 20px #0c1d3c77;
}
.brand-sub {
  color: #8ca0c3;
  font-weight: 510;
}
main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 23px 0 58px;
}
.monitor {
  width: min(100%, 760px);
  text-align: center;
}
h1 {
  margin: 0;
  color: #c5d2e9;
  font-size: clamp(22px, 3vw, 32px);
  line-height: 1.4;
  letter-spacing: -.04em;
  font-weight: 650;
}
.status {
  margin: 26px auto 40px;
  font-size: clamp(66px, 11vw, 112px);
  line-height: 1.12;
  letter-spacing: -.075em;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  transition: color .2s ease;
}
.status[data-state="unsupported"] {
  color: #ffcf9b;
  text-shadow: 0 0 65px #d88f3b1a;
}
.status[data-state="supported"] {
  color: #9eeacb;
  text-shadow: 0 0 65px #39c78d24;
}
.status[data-state="unknown"] {
  color: #bdd0f3;
}
.status[data-state="loading"] {
  color: #879bbd;
  font-size: clamp(45px, 8vw, 72px);
  min-height: 1.74em;
}
.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid #2b3850;
  border-radius: 18px;
  background: linear-gradient(145deg, #19253aaf, #101a2aaf);
  box-shadow: 0 12px 45px #00000018;
  overflow: hidden;
}
.metric {
  padding: 25px 20px 26px;
  min-width: 0;
}
.metric + .metric {
  border-left: 1px solid #2b3850;
}
.metric-label {
  color: #8fa5c7;
  font-size: 13px;
  font-weight: 560;
  margin-bottom: 9px;
}
.metric-value {
  color: #edf4ff;
  font-weight: 760;
  letter-spacing: -.035em;
  font-size: clamp(23px, 3.5vw, 32px);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.metric-value.date {
  font-size: clamp(20px, 3vw, 27px);
}
.time-block { margin-top: 37px; }
.time-label { color: #8599bc; font-size: 13px; margin-bottom: 11px; }
.time-value {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: baseline;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.today { color: #bac9e1; font-size: 19px; letter-spacing: -.015em; }
.clock { color: #edf4ff; font-size: clamp(26px, 5vw, 38px); font-weight: 680; letter-spacing: -.035em; }
.notice {
  width: fit-content;
  max-width: 100%;
  margin: 25px auto 0;
  padding: 10px 14px;
  border: 1px solid #86693f;
  border-radius: 9px;
  background: #4e391b35;
  color: #f4ce92;
  font-size: 13px;
  line-height: 1.6;
}
[hidden] { display: none !important; }
footer {
  border-top: 1px solid #26344b;
  padding: 21px 0 25px;
  color: #7f92b2;
  font-size: 12px;
  line-height: 1.7;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 20px;
  text-align: center;
}
footer a {
  color: #a2b9df;
  text-decoration: underline;
  text-decoration-color: #5b7097;
  text-underline-offset: 3px;
}
footer a:hover, footer a:focus-visible { color: #ecf3ff; }
footer .dot { margin: 0 7px; color: #667b9e; }
@media (max-width: 560px) {
  .page { width: min(100% - 32px, 1100px); }
  .topbar { min-height: 72px; }
  .brand { font-size: 15px; }
  .brand-mark { width: 31px; height: 31px; }
  main { padding: 28px 0 42px; }
  .status { margin: 25px auto 34px; }
  .metric { padding: 21px 10px 23px; }
  .metric-label { font-size: 12px; }
  .time-block { margin-top: 32px; }
  .time-value { gap: 4px 12px; }
  .today { font-size: 17px; }
  footer { padding: 18px 0 22px; gap: 5px 15px; }
}
@media (max-width: 350px) {
  .metrics { grid-template-columns: 1fr; }
  .metric + .metric { border-left: 0; border-top: 1px solid #2b3850; }
  .metric { padding: 15px; }
  .status { font-size: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .status { transition: none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Antigravity 中文支持状态首页">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Antigravity <span class="brand-sub">/ 中文状态</span></span>
    </a>
  </header>

  <main>
    <section class="monitor" aria-label="中文界面支持监测">
      <h1>Antigravity App 支持中文了吗？</h1>
      <div class="status" id="language" data-state="loading" role="status" aria-live="polite">查询中</div>

      <div class="metrics" aria-label="应用版本与核验日期">
        <div class="metric">
          <div class="metric-label">最新 App 版本</div>
          <div class="metric-value" id="version">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">最近核验日期</div>
          <div class="metric-value date" id="checked">—</div>
        </div>
      </div>

      <div class="time-block">
        <div class="time-label">当前北京时间</div>
        <div class="time-value">
          <span class="today" id="today">——</span>
          <time class="clock" id="clock" aria-live="off">--:--:--</time>
        </div>
      </div>
      <p class="notice" id="notice" role="alert" hidden></p>
    </section>
  </main>

  <footer>
    <span>每天北京时间 00:00 自动检查</span>
    <span>官方依据：
      <a id="version-link" href="https://antigravity.google/docs/changelog" target="_blank" rel="noopener noreferrer">更新日志</a>
      <span class="dot" aria-hidden="true">·</span>
      <a id="language-link" href="https://discuss.ai.google.dev/t/official-i18n-support-for-antigravity-gui-externalized-strings-and-a-community-translation-pipeline/199401" target="_blank" rel="noopener noreferrer">语言支持</a>
    </span>
    <span>独立监测 · 以 Google 官方信息为准</span>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var node = function (id) { return document.getElementById(id); };
  var dateFormat = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  var timeFormat = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit',
    second: '2-digit', hour12: false
  });
  var verifiedAt = null;
  var state = 'loading';

  function beijingDate(value) {
    return dateFormat.format(value).replaceAll('/', '-');
  }
  function tick() {
    var now = new Date();
    node('today').textContent = beijingDate(now);
    node('clock').textContent = timeFormat.format(now);
    if (verifiedAt) updateNotice();
  }
  function showNotice(message) {
    node('notice').textContent = message;
    node('notice').hidden = !message;
  }
  function updateNotice() {
    if (verifiedAt && Date.now() - verifiedAt.getTime() > 36 * 3600000) {
      showNotice('距离上次核验已超过 36 小时，状态可能过期。');
    } else if (state === 'unknown') {
      showNotice('新版本的中文界面支持情况尚待官方证实。');
    } else {
      showNotice('');
    }
  }
  function updateLink(id, url) {
    if (typeof url === 'string' && url.startsWith('https://')) {
      node(id).href = url;
    }
  }

  tick();
  setInterval(tick, 1000);

  fetch('./status.json', { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('Status request failed');
      return response.json();
    })
    .then(function (data) {
      var labels = { supported: '已支持', unsupported: '暂不支持', unknown: '待核实' };
      state = Object.prototype.hasOwnProperty.call(labels, data.chinese_ui)
        ? data.chinese_ui : 'unknown';
      node('language').textContent = labels[state];
      node('language').dataset.state = state;
      node('version').textContent = data.version ? 'v' + String(data.version).replace(/^v/, '') : '待核实';
      verifiedAt = data.verified_at ? new Date(data.verified_at) : null;
      if (verifiedAt && !Number.isNaN(verifiedAt.getTime())) {
        node('checked').textContent = beijingDate(verifiedAt);
      } else {
        verifiedAt = null;
        node('checked').textContent = '待核实';
      }
      updateLink('version-link', data.version_source);
      updateLink('language-link', data.language_source);
      updateNotice();
    })
    .catch(function () {
      state = 'unknown';
      node('language').textContent = '暂无法核实';
      node('language').dataset.state = 'unknown';
      node('version').textContent = '—';
      node('checked').textContent = '—';
      showNotice('暂时无法读取最新状态，请稍后再试。');
    });
})();
</script>
</body>
</html>
